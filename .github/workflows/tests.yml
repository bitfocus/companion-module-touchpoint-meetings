name: Tests

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Prepare Environment
        run: |
          corepack enable
      - name: Prepare module
        run: |
          yarn install
        env:
          CI: true
      - name: Check the embedded script is current
        run: |
          yarn embed
          git diff --exit-code src/scriptSource.ts
      - name: Test the module
        run: |
          yarn test
      - name: Test the TouchPoint script
        run: |
          python3 -m unittest discover -s test/python -v
